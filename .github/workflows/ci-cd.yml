name: CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set Up JDK
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Diffblue Cover CLI
        run: |
          curl -L https://download.diffblue.com/cover-cli/latest/linux.tar.gz -o diffblue.tar.gz
          tar -xzf diffblue.tar.gz
          chmod +x cover-cli
          sudo mv cover-cli /usr/local/bin/diffblue

      - name: Generate Tests with Diffblue (Without Saving to Repo)
        run: diffblue create --all --output src/test/java

      - name: Build with Maven
        run: mvn clean install

      - name: Run Tests
        run: mvn test

